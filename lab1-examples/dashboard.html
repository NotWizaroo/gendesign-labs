<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Генеративный дизайн — примеры из лабы 1</title>
<style>
  :root {
    --bg: #14161a;
    --card: #1d2027;
    --border: #2c303a;
    --text: #e8e9ec;
    --text-dim: #9a9fab;
    --accent: #6aa9ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  header {
    padding: 24px 28px 8px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    padding: 20px 28px 60px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-canvas {
    background: #0c0d10;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
  }
  .card-canvas canvas { display: block; }
  .card-body {
    padding: 14px 16px 16px;
  }
  .card-body h2 {
    font-size: 15px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .card-body .hint {
    font-size: 12px;
    color: var(--accent);
    margin: 0 0 8px;
  }
  .card-body p.desc {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .card-body .filename {
    font-size: 11px;
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    margin: 0 0 10px;
  }
  pre.code {
    background: #0c0d10;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 11.5px;
    line-height: 1.5;
    overflow-x: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #c9d1d9;
    margin: 0;
  }
  pre.code .kw { color: #ff7b72; }
  pre.code .fn { color: #d2a8ff; }
  pre.code .num { color: #79c0ff; }
  pre.code .cm { color: #6a737d; }
</style>
</head>
<body>

<header>
  <h1>Генеративный дизайн — примеры из методички к лабе 1</h1>
  <p>Живые версии эффектов, которые разбирались в теоретической части (работа с цветом, формой, текстом). Наведи мышь/кликай прямо на канвас — большинство реагирует на курсор.</p>
</header>

<div class="grid" id="grid"></div>

<script src="libs/p5.min.js"></script>

<script src="examples/01-color-contrast.js"></script>
<script src="examples/02-color-tiles.js"></script>
<script src="examples/03-image-palette.js"></script>
<script src="examples/04-radial-lines.js"></script>
<script src="examples/05-diagonal-grid.js"></script>
<script src="examples/06-moire-scatter.js"></script>
<script src="examples/07-moire-overlay.js"></script>
<script src="examples/08-agent-walk.js"></script>
<script src="examples/09-text-mouse.js"></script>

<script src="dashboard.js"></script>

</body>
</html>
